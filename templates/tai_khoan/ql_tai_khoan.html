<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Hệ Thống Tài Khoản - CogniFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cogniflow.css') }}">
</head>
<body>

<div class="admin-layout">
    <!-- GỌI SIDEBAR RIÊNG BIỆT VÀO ĐÂY -->
    {% include 'admin/sidebar.html' %}

    <!-- KHUNG NỘI DUNG CHÍNH BÊN PHẢI -->
    <main class="admin-main">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <div>
                <h1 style="font-size: 24px; margin: 0 0 5px 0; color: #fff;">Quản Lý Hệ Thống Tài Khoản</h1>
                <p style="color: #888; font-size: 14px; margin: 0;">Quản lý phân quyền, trạng thái và thông tin tài khoản người dùng trong hệ thống.</p>
            </div>
            <button id="btnOpenAddModal" style="background: #007bff; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px;">
                + Thêm tài khoản mới
            </button>
        </div>

        <!-- Thanh tìm kiếm -->
        <div style="margin-bottom: 20px;">
            <input type="text" id="searchInput" class="input-search" placeholder="🔍 Tìm kiếm theo tên đăng nhập hoặc họ tên...">
        </div>

        <!-- Bảng danh sách tài khoản -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Tên hiển thị</th>
                        <th>Vai trò</th>
                        <th>Trạng thái</th>
                        <th style="text-align: center;">Hành động quản trị</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Dữ liệu được load động bằng JavaScript -->
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Modal Thêm Tài Khoản -->
<div id="addUserModal" class="modal">
    <div style="background:#1e1e1e; padding:25px; border-radius:8px; width:400px; color:#fff; border:1px solid #333;">
        <h3 style="margin-top:0;">Thêm tài khoản mới</h3>
        <div style="margin-bottom: 12px;">
            <label style="font-size: 13px; color: #aaa;">Tên đăng nhập:</label>
            <input type="text" id="newUsername" class="input-search" style="width:100%; margin-top:5px;" placeholder="Nhập username...">
        </div>
        <div style="margin-bottom: 12px;">
            <label style="font-size: 13px; color: #aaa;">Mật khẩu:</label>
            <input type="password" id="newPassword" class="input-search" style="width:100%; margin-top:5px;" placeholder="Nhập mật khẩu...">
        </div>
        <div style="margin-bottom: 12px;">
            <label style="font-size: 13px; color: #aaa;">Họ tên / Tên hiển thị:</label>
            <input type="text" id="newDisplayName" class="input-search" style="width:100%; margin-top:5px;" placeholder="Nhập họ tên...">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="font-size: 13px; color: #aaa;">Vai trò:</label>
            <select id="newRole" class="input-search" style="width:100%; margin-top:5px;">
                <option value="quan_tri">Quản trị viên (Admin)</option>
                <option value="hoc_sinh">Học sinh</option>
            </select>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button type="button" id="btnCloseAddModal" style="padding:8px 15px; background:#555; color:#fff; border:none; border-radius:4px; cursor:pointer;">Hủy</button>
            <button type="button" id="btnSubmitAddUser" style="padding:8px 15px; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer;">Lưu</button>
        </div>
    </div>
</div>

<!-- Modal Sửa Tài Khoản -->
<div id="editModal" class="modal">
    <div style="background:#1e1e1e; padding:25px; border-radius:8px; width:400px; color:#fff; border:1px solid #333;">
        <h3 style="margin-top:0;">Chỉnh sửa tài khoản</h3>
        <form id="editForm">
            <input type="hidden" id="editUsernameGoc">
            <div style="margin-bottom: 12px;">
                <label style="font-size: 13px; color: #aaa;">Tên đăng nhập:</label>
                <input type="text" id="editUsername" class="input-search" style="width:100%; margin-top:5px;">
            </div>
            <div style="margin-bottom: 12px;">
                <label style="font-size: 13px; color: #aaa;">Họ tên / Tên hiển thị:</label>
                <input type="text" id="editDisplayName" class="input-search" style="width:100%; margin-top:5px;">
            </div>
            <div style="margin-bottom: 12px;">
                <label style="font-size: 13px; color: #aaa;">Vai trò:</label>
                <select id="editRole" class="input-search" style="width:100%; margin-top:5px;">
                    <option value="quan_tri">Quản trị viên (Admin)</option>
                    <option value="hoc_sinh">Học sinh</option>
                </select>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="font-size: 13px; color: #aaa;">Mật khẩu mới (Bỏ trống nếu không đổi):</label>
                <input type="password" id="editPassword" class="input-search" style="width:100%; margin-top:5px;" placeholder="Nhập mật khẩu mới...">
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button type="button" onclick="dongModalSua()" style="padding:8px 15px; background:#555; color:#fff; border:none; border-radius:4px; cursor:pointer;">Hủy</button>
                <button type="submit" style="padding:8px 15px; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer;">Lưu thay đổi</button>
            </div>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='js/quanly_taikhoan.js') }}"></script>
</body>
</html>
